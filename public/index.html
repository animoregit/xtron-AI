<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XTRON X1 — AI Assistant</title>
  <meta name="description" content="XTRON X1 is an AI assistant focused on coding, programming, and problem-solving." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css?v=3" />
</head>
<body>
  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">XTRON <span class="brand-accent">X1</span></span>
      </div>
      <button id="btn-close-sidebar" class="icon-btn sidebar-close" title="Close sidebar" aria-label="Close sidebar">✕</button>
    </div>
    <button id="btn-new-chat" class="new-chat-btn">
      <span class="plus-icon">＋</span> New Chat
    </button>
    <nav id="chat-history" class="chat-history" aria-label="Chat history"></nav>
    <div class="sidebar-footer">
      <span class="footer-label">Local · Ollama · Private</span>
    </div>
  </aside>

  <!-- ── Main area ──────────────────────────────────────────── -->
  <main id="main" class="main">
    <!-- Top bar -->
    <header class="topbar">
      <button id="btn-open-sidebar" class="icon-btn" title="Open sidebar" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="topbar-title" id="topbar-title">New Chat</h1>
      <div class="topbar-status" id="topbar-status"></div>
    </header>

    <!-- Messages -->
    <section id="messages" class="messages" aria-live="polite"></section>

    <!-- Welcome screen (shown when empty) -->
    <section id="welcome" class="welcome">
      <div class="welcome-icon">⚡</div>
      <h2>XTRON X1</h2>
      <p class="welcome-sub">Your private AI coding assistant. Ask me anything about code, debugging, or building projects.</p>
      <div class="welcome-chips">
        <button class="chip" data-prompt="Explain async/await in JavaScript">Explain async/await</button>
        <button class="chip" data-prompt="Write a Python function to sort a list of dictionaries by key">Sort dicts in Python</button>
        <button class="chip" data-prompt="What is the difference between flexbox and grid in CSS?">Flexbox vs Grid</button>
        <button class="chip" data-prompt="Help me debug a Node.js server that crashes on startup">Debug Node.js crash</button>
      </div>
    </section>

    <!-- Input area -->
    <div class="input-area">
      <form id="chat-form" class="input-wrapper" autocomplete="off">
        <textarea id="user-input" class="user-input" rows="1" placeholder="Message XTRON X1…" aria-label="Message input"></textarea>
        <button id="btn-send" class="send-btn" type="submit" title="Send message" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
      <p class="input-hint">XTRON X1 runs locally via Ollama. Your data stays on your machine.</p>
    </div>
  </main>

  <!-- ── Overlay for mobile sidebar ─────────────────────────── -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <script src="/app.js?v=3"></script>
</body>
</html>
